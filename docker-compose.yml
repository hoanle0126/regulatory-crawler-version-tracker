name: regtracker

services:
  regtracker-postgres:
    image: postgres:16-alpine
    container_name: regtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: regtracker
      POSTGRES_PASSWORD: regtracker_secret
      POSTGRES_DB: regtracker_db
    ports:
      - "55432:5432"
    volumes:
      - regtracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regtracker -d regtracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - regtracker-net

  regtracker-redis:
    image: redis:7-alpine
    container_name: regtracker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - regtracker_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - regtracker-net

volumes:
  regtracker_postgres_data:
    name: regtracker_postgres_data
  regtracker_redis_data:
    name: regtracker_redis_data

networks:
  regtracker-net:
    name: regtracker_network
